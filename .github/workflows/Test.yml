name: Secure & High-Performance RDP (Singapore - Final Fixed)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
      - name: Configure Core & High-Performance RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force

          # Performance Tweaks: Disable Visual Effects
          New-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "Environment" -PropertyType String -Value "" -Force
          
          # Modern Firewall Rule
          if (Get-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue) {
              Remove-NetFirewallRule -DisplayName "RDP-Tailscale"
          }
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP High-Performance configuration completed."

      - name: Create RDP User with Ultra-Secure Password
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = [char[]](33..46)
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -Description "Optimized RDP User"
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          Write-Host "RDP user created successfully."

      - name: Route Traffic through Singapore (VPN)
        shell: powershell
        run: |
          Write-Host "Installing OpenVPN CLI..."
          choco install openvpn -y --no-progress

          Write-Host "Fetching Live Singapore VPN Config..."
          $attempts = 0
          $success = $false
          
          while (-not $success -and $attempts -lt 3) {
              $attempts++
              try {
                  $api = Invoke-WebRequest -Uri "http://www.vpngate.net/api/iphone/" -UseBasicParsing -TimeoutSec 15
                  $sgLine = $api.Content -split "`n" | Where-Object { $_ -match ",SG," -and $_ -match "vpngate" } | Select-Object -First 1
                  
                  if ($sgLine) {
                      $fields = $sgLine -split ","
                      $b64Config = $fields[-1].Trim()
                      $configBytes = [System.Convert]::FromBase64String($b64Config)
                      [System.IO.File]::WriteAllBytes("$env:TEMP\singapore.ovpn", $configBytes)
                      $success = $true
                  } else {
                      Write-Host "Attempt $($attempts): No active Singapore server found in the list. Retrying..."
                      Start-Sleep -Seconds 3
                  }
              } catch {
                  Write-Host "Attempt $($attempts): Connection to VPN API failed. Retrying..."
                  Start-Sleep -Seconds 3
              }
          }

          if (-not $success) {
              Write-Warning "Singapore VPN servers are currently offline. Proceeding with default location to avoid freezing."
          } else {
              Write-Host "Connecting to Singapore VPN Tunnel..."
              Start-Process "C:\Program Files\OpenVPN\bin\openvpn.exe" -ArgumentList "--config `"$env:TEMP\singapore.ovpn`"" -WindowStyle Hidden
              Start-Sleep -Seconds 10
          }

          Write-Host "Verifying current location..."
          try {
              $ipInfo = Invoke-RestMethod -Uri "https://ipinfo.io/json" -UseBasicParsing
              Write-Host "Current Virtual Location: $($ipInfo.city), $($ipInfo.country) | IP: $($ipInfo.ip)"
          } catch {
              Write-Host "Location verification skipped."
          }

      - name: Install Latest Tailscale Dynamically
        shell: powershell
        run: |
          Write-Host "Installing Tailscale via Chocolatey safely..."
          choco install tailscale -y --no-progress

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
              $tsPath = "tailscale"
          }

          & $tsPath up `
              --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
              --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          for ($i = 1; $i -le 15; $i++) {
              Start-Sleep -Seconds 3
              $tsIP = & $tsPath ip -4 2>$null
              if ($tsIP) { break }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment timed out!"
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale Connected! IP: $tsIP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 5; $i++) {
              $test = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
              if ($test.TcpTestSucceeded) {
                  $success = $true
                  break
              }
              Start-Sleep -Seconds 3
          }
          if (-not $success) { Write-Error "RDP Service Error"; exit 1 }

      - name: Maintain Connection & Output Details
        shell: powershell
        run: |
          Write-Host "`n=========================================" -ForegroundColor Green
          Write-Host "    RDP CONNECTION DETAILS (SINGAPORE)   " -ForegroundColor Green
          Write-Host "=========================================" -ForegroundColor Green
          Write-Host " IP Address : $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host " Username   : RDP" -ForegroundColor Cyan
          Write-Host " Credentials: $env:RDP_CREDS" -ForegroundColor Yellow
          Write-Host "=========================================`n" -ForegroundColor Green

          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session Active. Press 'Cancel workflow' to stop."
              Start-Sleep -Seconds 180
          }
          
